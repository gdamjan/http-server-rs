[package]
name = "http-server"
version = "0.15.0"
authors = ["Damjan Georgievski <gdamjan@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/gdamjan/http-server-rs"
edition = "2024"

[dependencies]
actix-web = "4.1.0"
actix-files = "0.7"
clap = { version = "4", features = ["cargo"] }
env_logger = "*"
log = "*"
percent-encoding = "2.2"
v_htmlescape = "0.17"
async-tar = { version = "0.6.1", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.54.1", features = ["io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[profile.release]
opt-level = 'z'
lto = true
panic = 'abort'
strip = true
codegen-units = 1
